name: 알림 저장소 배포·동기화
on:
  push:
    branches: [main]
    paths: ['worker/**', 'scripts/deploy-worker.mjs', '.github/workflows/worker.yml']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: worker
  cancel-in-progress: false
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 배포
        if: github.event_name != 'schedule' || hashFiles('push/worker.json') == ''
        run: node scripts/deploy-worker.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INVITE_CODE: ${{ secrets.INVITE_CODE }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      - name: 맞춤 설정 동기화
        run: node scripts/sync-profiles.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      - name: 바뀐 것 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A push/
          git diff --cached --quiet || (git commit -m "알림 저장소 동기화 [no-notify]" && git pull --rebase origin main && git push)
