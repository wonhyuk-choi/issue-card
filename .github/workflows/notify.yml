name: 알림 보내기
on:
  push:
    branches: [main]
    paths: ['data/today.json']
  workflow_dispatch:
    inputs:
      test:
        description: '테스트 알림으로 보내기'
        type: boolean
        default: true
concurrency:
  group: notify
  cancel-in-progress: true
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock web-push@3.6.7
      - run: node scripts/send-push.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
