<meta name="theme-color" content="#0f1319" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: one full-height card at a time, story-style progress on top, thumb-zone controls at the bottom */
:root {
  --bg: #e9edf2;
  --card: #ffffff;
  --ink: #131820;
  --muted: #5a6474;
  --line: #d9dfe7;
  --soft: #f3f5f8;
  --accent: #1f4fd8;
  --c-econ: #1f4fd8;
  --c-pol: #7a3fc4;
  --c-soc: #0c8a7a;
  --c-world: #b86a00;
  --c-tech: #3b47c9;
  --c-sec: #c4323a;
  --c-biz: #a14a8c;
  --c-job: #4d6b1f;
  --c-ent: #c2410c;
  --c-trend: #0e7490;
  --shadow: 0 10px 30px rgba(20, 30, 50, .12), 0 2px 6px rgba(20, 30, 50, .06);
  --f-text: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1319; --card: #181e27; --ink: #e8ecf2; --muted: #9aa5b5; --line: #2a3340; --soft: #1f2732;
    --accent: #7c9cff; --c-econ: #7c9cff; --c-pol: #b88cf0; --c-soc: #4cc7b4; --c-world: #f0a944;
    --c-tech: #8f98ff; --c-sec: #ff7c83; --c-biz: #e48cc9; --c-job: #a5cf62; --c-ent: #ff9b6b; --c-trend: #5fd0e6;
    --shadow: 0 10px 30px rgba(0,0,0,.45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1319; --card: #181e27; --ink: #e8ecf2; --muted: #9aa5b5; --line: #2a3340; --soft: #1f2732;
  --accent: #7c9cff; --c-econ: #7c9cff; --c-pol: #b88cf0; --c-soc: #4cc7b4; --c-world: #f0a944;
  --c-tech: #8f98ff; --c-sec: #ff7c83; --c-biz: #e48cc9; --c-job: #a5cf62; --c-ent: #ff9b6b; --c-trend: #5fd0e6;
  --shadow: 0 10px 30px rgba(0,0,0,.45); color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-text);
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 12px; max-width: 520px; margin: 0 auto; box-sizing: border-box;
}
.top { display: grid; gap: 8px; }
.bars { display: flex; gap: 3px; }
.bars span { flex: 1; height: 3px; border-radius: 2px; background: var(--line); transition: background .2s; }
.bars span.on { background: var(--ink); }
.meta { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 600; letter-spacing: .02em; }
.meta .count { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

.stage { position: relative; min-height: 0; }
.card {
  position: absolute; inset: 0; background: var(--card); border-radius: 22px; box-shadow: var(--shadow);
  overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; user-select: none;
  display: flex; flex-direction: column; will-change: transform;
}
.card.under { transform: translateY(10px) scale(.955); opacity: .7; pointer-events: none; box-shadow: none; }
.card.anim { transition: transform .26s cubic-bezier(.2,.7,.3,1), opacity .26s; }
.card.enter { animation: enter .28s cubic-bezier(.2,.7,.3,1); }
@keyframes enter { from { transform: translateX(-30%) rotate(-3deg); opacity: 0; } }
.stripe { height: 6px; background: var(--cat); flex: none; }
.inner { padding: 20px 20px 22px; display: grid; gap: 16px; align-content: start; }
.chip {
  justify-self: start; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--cat);
  border: 1.5px solid var(--cat); border-radius: 999px; padding: 3px 10px;
}
.figure { display: grid; gap: 2px; }
.figure .num { font-family: var(--f-num); font-weight: 600; font-size: clamp(34px, 11vw, 46px); line-height: 1.05; color: var(--cat); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.figure .lab { font-size: 13px; color: var(--muted); }
h2 { margin: 0; font-size: 23px; line-height: 1.35; font-weight: 700; text-wrap: balance; word-break: keep-all; }
ul.pts { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
ul.pts li { position: relative; padding-left: 16px; font-size: 15.5px; line-height: 1.6; word-break: keep-all; }
ul.pts li::before { content: ""; position: absolute; left: 2px; top: .7em; width: 6px; height: 6px; border-radius: 50%; background: var(--cat); }
.why { background: var(--soft); border-radius: 14px; padding: 12px 14px; font-size: 14.5px; line-height: 1.6; word-break: keep-all; }
.why b { display: block; font-size: 12px; letter-spacing: .06em; color: var(--cat); margin-bottom: 2px; }
.src { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 12px; }
.src a { color: var(--muted); text-underline-offset: 2px; }

/* cover */
.cover .inner { gap: 18px; }
.cover .date { font-family: var(--f-num); font-size: 13px; color: var(--muted); letter-spacing: .04em; }
.cover h1 { margin: 0; font-size: 30px; line-height: 1.3; font-weight: 700; word-break: keep-all; text-wrap: balance; }
.toc { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.toc li button {
  width: 100%; display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: baseline; text-align: left;
  background: none; border: 0; padding: 9px 4px; border-bottom: 1px solid var(--line); color: var(--ink);
  font: 500 15px/1.45 var(--f-text); cursor: pointer; word-break: keep-all;
}
.toc li:last-child button { border-bottom: 0; }
.toc .n { font-family: var(--f-num); font-size: 12px; color: var(--c); font-weight: 600; }
.hint { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.hint svg { flex: none; animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(-6px); } }

.end .inner { align-content: center; min-height: 100%; box-sizing: border-box; text-align: center; justify-items: center; }
.end h2 { font-size: 24px; }
.end p { margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.6; word-break: keep-all; }

.refresh { display: grid; gap: 8px; padding-top: 4px; width: 100%; }
.rbtn {
  height: 50px; border-radius: 14px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent);
  font: 600 15.5px var(--f-text); display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
}
.rbtn:disabled { opacity: .55; cursor: default; }
.rstatus { margin: 0; font-size: 13px; line-height: 1.55; color: var(--muted); word-break: keep-all; text-align: left; }
.rstatus.err { color: var(--c-sec); }
.controls { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }
.controls button {
  height: 54px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
  font: 600 16px var(--f-text); display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
}
.controls button.next { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.controls button:disabled { opacity: .35; cursor: default; }
button:focus-visible, a:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  .card.anim, .card.enter, .hint svg { transition: none; animation: none; }
}
html, body { margin: 0; }
.app { padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
.loading .inner { align-content: center; min-height: 100%; box-sizing: border-box; text-align: center; justify-items: center; color: var(--muted); }
.panel { display: grid; gap: 8px; width: 100%; text-align: left; border-top: 1px solid var(--line); padding-top: 14px; }
.panel h3 { margin: 0; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.panel h3 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.panel h3 .dot.on { background: var(--c-soc); }
.panel p { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--muted); word-break: keep-all; text-align: left; }
.panel ol { margin: 0; padding-left: 20px; font-size: 13.5px; line-height: 1.7; color: var(--ink); word-break: keep-all; }
.code { font-family: var(--f-num); font-size: 11px; line-height: 1.45; background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; max-height: 84px; overflow: auto; word-break: break-all; user-select: all; -webkit-user-select: all; color: var(--ink); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rbtn.solid { background: var(--accent); color: #fff; border-color: var(--accent); }
.rbtn.small { height: 44px; font-size: 14.5px; }
.setup .inner { gap: 14px; }
.setup h1 { margin: 0; font-size: 26px; line-height: 1.3; font-weight: 700; word-break: keep-all; }
.setup p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); word-break: keep-all; }
.setup label { font-size: 13px; font-weight: 700; display: grid; gap: 6px; }
.chips.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.chips.days button { padding: 8px 0; }
.card.setup { overflow-x: hidden; touch-action: pan-y; }
body.in-setup .controls, body.in-setup .bars { display: none; }
body.in-setup .app { grid-template-rows: auto 1fr; }
.setup input[type="time"] { -webkit-appearance: none; appearance: none; display: block; min-height: 48px; max-width: 100%; text-align: left; }
.setup input, .setup textarea { font: 400 16px/1.5 var(--f-text); color: var(--ink); background: var(--soft); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; box-sizing: border-box; user-select: text; -webkit-user-select: text; }
.setup textarea { min-height: 72px; resize: vertical; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { font: 500 14px var(--f-text); color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--accent); font: 600 13.5px var(--f-text); text-align: left; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="bars" id="bars" aria-hidden="true"></div>
    <div class="meta"><b id="dateLabel">이슈 카드</b><span class="count" id="count"></span></div>
  </header>
  <main class="stage" id="stage" aria-live="polite"></main>
  <nav class="controls">
    <button id="prev" type="button" aria-label="이전 이슈">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>이전
    </button>
    <button id="next" class="next" type="button" aria-label="다음 이슈">다음
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </nav>
</div>

<script>

  var CLAUDE_REFRESH_URL = 'https://claude.ai/artifact/BoJLPa1UdMstYCaAk2Dr1k';

  var raw = null, data = null, slides = [{ type: 'loading' }], i = 0, cur;
  var INTERESTS = ['경제·금리·환율', '정치·사회', '국제', '반도체·전자', 'IT·AI·소프트웨어', '제조·스마트팩토리', '에너지·전력', '자동차·모빌리티', '건설·부동산', '금융·투자', '바이오·헬스케어', '유통·소비재', '공공·교육', '게임·콘텐츠', '연예·방송', '영화·드라마·OTT', '음악·공연', '인터넷 밈·트렌드', '스포츠', '여행·맛집', '패션·뷰티', '생활 꿀팁·쇼핑', '취업·이직'];

  }

  var cached = ls('issue-data-' + dataFile());

  var loadingNow = false, refreshMsg = '', refreshKind = '', loadedFile = null;
  function load(manual) {

      });
    }
    if (name === 'showcode') { ls('push-registered', null); return render(false); }
    if (name === 'install' && installEvt) { installEvt.prompt(); installEvt.userChoice.then(function () { installEvt = null; render(false); }); }
  }

  function bind(el) {
    var x0, y0, dx = 0, mode = null, id = null, moved = false;
    var still = el.classList.contains('setup'); // 맞춤 설정 화면은 옆으로 밀리지 않게 고정
    if (!still) el.addEventListener('pointerdown', function (e) { x0 = e.clientX; y0 = e.clientY; dx = 0; mode = null; id = e.pointerId; moved = false; el.classList.remove('anim'); });
    el.addEventListener('pointermove', function (e) {
      if (id !== e.pointerId || x0 == null) return;
      var ddx = e.clientX - x0, ddy = e.clientY - y0;
      if (!mode && (Math.abs(ddx) > 8 || Math.abs(ddy) > 8)) {
        mode = Math.abs(ddx) > Math.abs(ddy) ? 'h' : 'v';
        if (mode === 'h') { try { el.setPointerCapture(e.pointerId); } catch (err) {} }
      }
      if (mode === 'h') { dx = ddx; moved = true; el.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 28) + 'deg)'; }
    });
    function end(e) {
      if (id !== e.pointerId) return;
      if (mode === 'h') { if (dx < -70) go(1); else if (dx > 70) go(-1); else snap(); }
      x0 = null; mode = null; id = null;
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('click', function (e) {
      if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; return; }
      var dd = e.target.closest('[data-day]');
      if (dd) { dd.setAttribute('aria-pressed', dd.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); return; }
      var hb = e.target.closest('[data-hol]');
      if (hb) { hb.setAttribute('aria-pressed', hb.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); return; }
      var c = e.target.closest('[data-chip]');
      if (c) { c.setAttribute('aria-pressed', c.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); return; }
      var a = e.target.closest('[data-act]');
      if (a) { e.preventDefault(); act(a.getAttribute('data-act')); return; }
      var j = e.target.closest('[data-jump]');
      if (j) jump(parseInt(j.getAttribute('data-jump'), 10));
    }, true);
  }

  document.getElementById('next').addEventListener('click', function () { go(1); });
  document.getElementById('prev').addEventListener('click', function () { go(-1); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') go(1);
    if (e.key === 'ArrowLeft') go(-1);
  });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') load(false); });
  if (!data) render(false);
  load(false);
})();
</script>
